 ##### Interest Groups: Great Reform Act Aftermath
 ig_derby_dillies: "Derby Dillies"
 ig_derby_dillies_desc: "The Derby Dilly, or Moderate Reformers, is a group of conservative dissent Whigs centered around Edward Smith-Stanley. They oppose further Whig-Irish cooperation, destruction of faithful ancient institutions and political radicalism. Torn between the increasingly radical Whiggery and the distasteful Toryism, they struggle to find their new place."

 ig_whigs: "Whigs"
 ig_whigs_desc: "The Whigs are a group as old as time, representing the increasingly liberal group of aristocrats and middle-class. They hold the belief in moderate reform, laissez-faire economics and preservation of power of the country gentlemen."

 ig_radicals_britain: "Radicals"
 ig_radicals_britain_desc: "The term Radicals refers to a broad set of people who collectively sub to the idea of political radicalism. Specific tendencies vary greatly, for instance, between the utilitarian Benthamites, the radical Millites and the laissez-faire Manchester Liberals."

 ig_peelites: "Peelites"
 ig_peelites_desc: "The Peelites are a faction of liberal-minded members of the Conservative Party, led by its leader Sir Robert Peel. They mainly hold the belief in co-dependence of commerce, industry and agriculture; liberal economics, softer conservatism and realism."

 ig_high_tories: "High-Tories"
 ig_high_tories_desc: "High Tories are a group of highly conservative, paternalistic and agrarianist followers of modern Toryism. Although have softened their conservatism with the appereance of the Conservative Party, they still retain their opposition to most change that harms the holy institutions of old."

 ig_agriculturists: "Agriculturists"
 ig_agriculturists_desc: "Agriculturists are a group centered around a simple, but often a dividing question: taxation reform and agricultural development, while also withholding the conservative policy. Often led by Ultra-Tory and the so-called 'Tory Radical' individuals, they represent the most rural-oriented wing of the Conservative Party."

 ig_palmerstonian_liberals: "Palmerstonian Liberals"
 ig_palmerstonian_liberals_desc: "Palmerstonian liberals are an incoherent group of independent gentlemen who sub to policies and ideas of Lord Palmerston. They are usually supportive of mild economic development, a wide variety of social reforms and active foreign policy."

 ig_irish_repealers: "Irish Repealers"
 ig_irish_repealers_desc: "The Acts of Union passed in 1800 united Ireland and Great Britain into a one, unified state — taking the self-governance of the Irish away in favor of a merged parliament in London. The Repealers seek to bring back the legislative autonomy, while also maintaning loyalty to the crown and cautiousness in action."

 ##### Ideologies:

 ideology_eco_aristocratic_laissez_faire: "Aristocratic Laissez-Faire"
 ideology_eco_aristocratic_laissez_faire_desc: "#lore This group believes in a market economy that operates optimally when fewer state forces intrude upon it, while also keeping the power of aristocracy intact.#!"
 
 ideology_eco_aristocratic_modernizer: "Aristocratic Modernizer"
 ideology_eco_aristocratic_modernizer_desc: "#lore This group seeks to modernize the economy, keeping the power of aristocracy intact.#!"

 ideology_dop_aristocratic_democrat: "Aristocratic-Democrat"
 ideology_dop_aristocratic_democrat_desc: "#lore Striking a middle stance, this group holds suffrage as a political principle, but believes that strong limits must be imposed to ensure the unwashed, uncultured masses don't rule.#!"

 ideology_dop_toryist: "Toryist"
 ideology_dop_toryist_desc: "#lore Opposing the recently introduced Great Reform Act, the Toryists seek to return to the times of old, or at least limit the impact of the reform.#!"

